name: VM4 Closed Carry Gate
on:
  pull_request:
jobs:
  gate:
    name: vm4-closed-carry-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: R23 isolated to serial combined-state discriminator
        shell: bash
        run: |
          if [[ -f r23-isolated-a.txt && -f r23-isolated-b.txt ]]; then
            echo "R23 combined-state sentinel: A+B must be rechecked after isolated to serial mode switch"
            exit 23
          fi
          if [[ -f auto-inplace-a.txt && -f auto-inplace-b.txt ]]; then
            echo "VM4 auto in-place combined-state sentinel: A+B requires merged-state CI"
            exit 42
          fi
          echo vm4-closed-carry-gate
