name: VM4 Default Branch Long Test Name Ingest 261016
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  vm4-longnode-default:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned official pytest plugin
        run: python -m pip install --disable-pip-version-check pytest==9.1.1 pytest-mergify==2026.10.5
      - name: Run inert default-branch name-length controls
        shell: bash
        env:
          MERGIFY_TOKEN: ${{ secrets.MERGIFY_TOKEN }}
          PYTEST_MERGIFY_ENABLE: "true"
        run: |
          python - <<'PY'
          from pathlib import Path
          Path("test_vm4_longnode_default_261016.py").write_text(
              'import pytest\n'
              '@pytest.mark.parametrize("value", [pytest.param(1,id="vm4-default-short-261016"),pytest.param(2,id="vm4-default-long-261016-"+("a"*8200))])\n'
              'def test_vm4_default_longnode_261016(value):\n'
              '    assert value in (1,2)\n'
          )
          PY
          python -m pytest -q --disable-warnings test_vm4_longnode_default_261016.py
