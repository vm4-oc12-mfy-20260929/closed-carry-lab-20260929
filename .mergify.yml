merge_queue:
  max_parallel_checks: 1
queue_rules:
  - name: resolver-self-policy-baseline
    batch_size: 2
    batch_max_wait_time: 2 min
    queue_conditions: true
    merge_conditions:
      - check-success = vm4-closed-carry-gate
      - schedule = 04:20-04:40
    conflict_resolvers:
      - paths:
          - resolver-target.txt
        strategy: ours
    merge_method: merge-batch
